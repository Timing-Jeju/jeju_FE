name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tooling/openapi
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx --no-install expo export --platform ios --platform android
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
